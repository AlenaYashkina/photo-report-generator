name: Generate PDF preview from real PPTX example
on:
  pull_request:
    paths:
      - .github/workflows/generate-pdf-preview.yml
jobs:
  pdf-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-pptx Pillow pandas pycairo openpyxl
      - name: Generate real PPTX sample and convert to PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libreoffice-impress poppler-utils
          python examples/tiny_demo.py --output artifacts/tiny_demo.pptx
          mkdir -p docs
          libreoffice -env:UserInstallation=file:///tmp/lo-profile --headless --convert-to pdf --outdir docs artifacts/tiny_demo.pptx
          mv docs/tiny_demo.pdf docs/synthetic-report-preview.pdf
          pdfinfo docs/synthetic-report-preview.pdf | grep '^Pages:'
          test -s docs/synthetic-report-preview.pdf
          test "$(pdfinfo docs/synthetic-report-preview.pdf | awk '/^Pages:/ {print $2}')" -ge 2
      - name: Commit generated PDF preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/synthetic-report-preview.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: include actual PDF rendition of synthetic tiny report"
            git push
          fi
