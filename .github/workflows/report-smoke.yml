name: Windows smoke check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  import-check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reporting dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q main.py photo_reports configs
      - name: Validate key imports
        run: python -c "import pandas, pptx, PIL, cairo, openpyxl; print('Required reporting dependencies import successfully')"
