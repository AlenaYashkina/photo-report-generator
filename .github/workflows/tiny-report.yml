name: Tiny PPTX regression example
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tiny-report:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python examples/tiny_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-tiny-report-windows
          path: artifacts/
          if-no-files-found: error
