name: Full synthetic report pipeline
on:
  pull_request:
  push:
    branches: [main]
jobs:
  full-pipeline:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python examples/full_pipeline_smoke.py
